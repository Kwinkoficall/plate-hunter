<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<title>Plate Hunter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11;--p:#17181b;--p2:#222428;--txt:#f1f3f8;--mut:#8a90a2;--blue:#6b7384;
  --top:max(env(safe-area-inset-top),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
.scr{position:absolute;inset:0;padding-top:calc(var(--top) + 10px);display:none;flex-direction:column}
.scr.on{display:flex}
.hd{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;flex:none}
.back{width:40px;height:40px;border:0;background:none;color:#a3a8b4;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.ttl{font-size:24px;font-weight:700;color:#a9aebd;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{text-align:right;line-height:1.3;flex:none}
.bal{font-size:17px;font-weight:700;color:#aeb3c2;white-space:nowrap}
.sub{font-size:13px;color:var(--mut);white-space:nowrap}
.scroll{flex:1;overflow-y:auto;padding:0 16px 28px;-webkit-overflow-scrolling:touch}

/* ---------- plates ---------- */
.pl{width:100%}
.plsvg{width:100%;height:auto;display:block;overflow:visible}
.pg-uncommon{filter:drop-shadow(0 0 7px rgba(61,220,132,.55))}
.pg-rare{filter:drop-shadow(0 0 10px rgba(59,155,255,.7))}
.pg-epic{filter:drop-shadow(0 0 14px rgba(180,107,255,.85))}
.pg-legendary{filter:drop-shadow(0 0 18px rgba(255,194,58,.95));animation:lg 1.5s ease-in-out infinite}
@keyframes lg{50%{filter:drop-shadow(0 0 32px rgba(255,194,58,1))}}
.pop{animation:pop .16s ease-out}
.pg-legendary.pop{animation:pop .16s ease-out,lg 1.5s .16s ease-in-out infinite}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:scale(1);opacity:1}}

/* ---------- menu ---------- */
.tile{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(165deg,#6f7685 0%,#41454f 55%,#1f2127 100%);border:1px solid #5d6270;height:116px}
.tile:active{transform:scale(.985)}
.tile.big{height:172px;margin-bottom:12px}
.tile.wide{height:88px;margin-bottom:12px}
.tile .tl{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;background:rgba(14,15,18,.84);font-weight:700;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase}
.art{position:absolute;inset:0 0 28px 0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mp{position:absolute;width:62%}
.bonus{background:linear-gradient(120deg,#5f6574,#838a9a 60%,#aab0bd);border-color:#a0a7b6}
.bonus.cd{background:linear-gradient(120deg,#2a2c33,#1d1f24);border-color:#3a3d47}
.bonus .art{justify-content:flex-start;padding:0 18px;gap:14px;font-size:36px}
.bonus b{font-size:22px;display:block}
.bonus small{font-size:13px;opacity:.85;display:block}

/* ---------- generator ---------- */
.cchip{align-self:center;margin-bottom:8px;flex:none;display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid #2f3239;border-radius:999px;padding:8px 14px 8px 8px;font-weight:600;font-size:15px}
.cchip .fl{width:30px;height:30px;border-radius:50%;mask-image:none;-webkit-mask-image:none}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:14px;min-height:0}
#stage{width:min(94vw,460px)}
.ghost{width:100%;aspect-ratio:520/112;border:2px dashed #3d414b;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#6b7290;font-weight:600;font-size:16px;text-align:center;line-height:1.35}
#pill{min-height:46px;display:flex;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:10px;padding:9px 14px;max-width:94vw;border-radius:999px;background:var(--rb);border:1px solid var(--rc);font-weight:700;font-size:14px;transition:box-shadow .2s;white-space:nowrap}
.pill .pn{color:var(--rc);width:92px;text-align:left}
.pill .dash i{width:12px;height:4px}
.pill .dash{margin:0}
.pill .pp{font-size:16px;font-variant-numeric:tabular-nums;width:112px;text-align:right}
.pill.bump{animation:bump .32s ease-out;box-shadow:0 0 26px var(--rc)}
@keyframes bump{40%{transform:scale(1.1)}}
#fx{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;overflow:hidden;z-index:5}
.tierlbl{position:absolute;left:50%;top:21%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--c);text-shadow:0 0 24px var(--c),0 0 60px var(--c);animation:tl .9s ease-out forwards;white-space:nowrap}
@keyframes tl{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.spk{position:absolute;left:50%;top:48%;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:spk 1.1s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hide{opacity:.18;filter:blur(7px);transform:scale(.9)}
.reveal{animation:rev .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes rev{from{transform:scale(.8)}to{transform:scale(1)}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
#info{text-align:center;min-height:118px;width:min(94vw,460px);color:#c3c6ce;font-size:14px;line-height:1.4;transition:opacity .35s}
#info div{margin-bottom:4px}
#info .ifact{color:#7f838d;font-size:12.5px;margin-top:6px}
#info .isn{color:#e6e8ed;font-size:15px}
.sub2{font-size:14px;color:var(--mut);margin-top:2px}
.dash{display:flex;gap:5px;justify-content:center;margin:9px 0}
.dash i{width:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.pv{font-size:24px;font-weight:700}
.acts{display:flex;gap:10px;padding:0 16px;justify-content:center;min-height:50px;flex:none}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:700;background:var(--blue);color:#fff}
.btn.g{background:var(--p2);color:#d5d9e6}
.btn:disabled{opacity:.35}
.foot{padding:14px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:13px;flex:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,var(--fc,#fff) 0%,transparent 62%)}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}

/* ---------- country ---------- */
.crow{position:relative;height:74px;border-radius:20px;background:#1d1f24;margin-bottom:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#8b90a0}
.crow .fl{position:absolute;left:0;top:0;bottom:0;width:42%}
.crow .cn{position:relative}
.crow .cc{position:absolute;right:20px;font-size:17px;font-weight:700}
.crow.on{background:var(--blue);color:#fff}
.fl{-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.f-ru{background:linear-gradient(#eceff3 33.3%,#0039a6 33.3% 66.6%,#d52b1e 66.6%)}
.f-by{background:repeating-linear-gradient(0deg,#c8313e 0 5px,#fff 5px 8px) 0 0/11% 100% no-repeat,linear-gradient(#c8313e 66.6%,#2e8f3f 66.6%)}
.f-kz{background:radial-gradient(circle at 58% 42%,#ffd24a 0 15%,transparent 16%),#00afca}
.f-any{background:linear-gradient(90deg,#00afca 33.3%,#eceff3 33.3% 66.6%,#d52b1e 66.6%)}
.cchip .f-any,.cchip .f-ru,.cchip .f-by,.cchip .f-kz{-webkit-mask-image:none;mask-image:none}

/* ---------- list screens ---------- */
.chips{display:flex;gap:8px;padding:0 16px 12px;flex:none;overflow-x:auto}
.chip{border:0;background:var(--p2);color:#c9cddb;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff}
.list{flex:1;overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.row{position:relative;display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 14px 10px 12px;margin-bottom:10px;background:linear-gradient(135deg,var(--rb),rgba(24,25,29,.95) 78%);border:2px solid transparent}
.row.sel{border-color:#c4c9d4;box-shadow:0 0 0 1px #c4c9d455}
.row.sel::after{content:"✓";position:absolute;left:8px;top:6px;width:22px;height:22px;border-radius:50%;background:#c4c9d4;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.row .pl{width:52%;flex:none}
.row .ri{flex:1;text-align:right;min-width:0}
.row .rt{font-size:12px;color:#9aa0b3;line-height:1.3}
.row .dash{justify-content:flex-end;margin:6px 0 4px}
.row .dash i{width:20px;height:4px}
.row .rv{font-size:18px;font-weight:700;color:#cfd3e0;white-space:nowrap}
.rr0{--rc:#9ea3b5;--rb:rgba(158,163,181,.20)}
.rr1{--rc:#3ddc84;--rb:rgba(61,220,132,.22)}
.rr2{--rc:#3b9bff;--rb:rgba(59,155,255,.26)}
.rr3{--rc:#b46bff;--rb:rgba(180,107,255,.28)}
.rr4{--rc:#ffc23a;--rb:rgba(255,194,58,.30)}
.more{display:block;margin:4px auto 10px}
.empty{color:var(--mut);text-align:center;margin-top:60px;font-size:15px;line-height:1.5}
.bar{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));flex:none}
.bar .btn{flex:1;padding:14px 8px;font-size:15px;background:var(--p2);color:#e5e8f2;line-height:1.2}
.bar .btn small{display:block;font-weight:600;font-size:12px;opacity:.75}
.bar .btn:disabled{color:#5a6075;opacity:1}
.bar .btn.pr:not(:disabled){background:var(--blue);color:#fff}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sbox{width:100%;background:#17181b;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sh{font-size:20px;font-weight:700;margin-bottom:14px}
.sl{color:var(--mut);font-size:13px;margin:12px 0 8px}
.sbox .chips{padding:0;flex-wrap:wrap;overflow:visible}
.sbox .chip{padding:10px 14px;font-size:14px}
.sbox .btn{width:100%;margin-top:18px}
.dlg{z-index:40}

/* ---------- upgrades ---------- */
.tile.upg .art{justify-content:flex-start;padding:0 18px;gap:14px;font-size:34px}
.tile.upg b{font-size:20px;display:block}
.tile.upg small{font-size:13px;opacity:.8;display:block}
.upc{border-radius:20px;padding:16px;margin-bottom:14px;background:linear-gradient(150deg,#2e3037,#171318 70%);border:1px solid #484c58}
.upc.sf{background:linear-gradient(150deg,#4a3a14,#17151a 70%);border-color:#6b5420}
.uh{display:flex;gap:12px;align-items:center}
.uh .ui{font-size:32px}
.uh b{font-size:20px;display:block}
.pips{display:flex;gap:4px;margin:14px 0 12px}
.pips i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.on{background:#c4c9d4}
.upc.sf .pips i.on{background:#ffc23a}
.un{font-size:14px;color:#b4bacc;margin-bottom:14px;line-height:1.45}
.un b{color:#fff}
.upc .btn{width:100%}
.upc .btn.dis{background:var(--p2);color:#8a90a2}
.upc .mx{text-align:center;color:#ffc23a;font-weight:700;padding:6px 0}

/* ---------- catalog / stats ---------- */
.cat{border-radius:20px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,var(--rb),rgba(24,25,29,.95) 80%);border:1px solid rgba(255,255,255,.06)}
.cat .ch{display:flex;justify-content:space-between;align-items:baseline}
.cat .ch b{font-size:20px;color:var(--rc)}
.cat .ch span{color:var(--mut);font-size:13px}
.cat .cd{margin-top:6px;font-size:15px;font-weight:600}
.cat .cr{margin:4px 0 12px;font-size:13px;color:#9aa0b3;line-height:1.4}
.cs{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px}
.cs .pl{width:230px;flex:none}
.st{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #20243133;font-size:16px}
.st span{color:var(--mut)}
.st b{font-weight:700}
.stb{border-radius:20px;padding:14px;margin:6px 0 16px;background:linear-gradient(135deg,var(--rb),rgba(24,25,29,.95) 80%)}
.stb .sub{margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2c2e35;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gWht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfa"/><stop offset=".5" stop-color="#ebebe6"/><stop offset="1" stop-color="#c9c9c3"/></linearGradient>
  <linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84a"/><stop offset=".55" stop-color="#f4b905"/><stop offset="1" stop-color="#cf9600"/></linearGradient>
  <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gStrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a63c4"/><stop offset="1" stop-color="#143a82"/></linearGradient>
  <radialGradient id="gRivet" cx=".35" cy=".35"><stop offset="0" stop-color="#b9b9b4"/><stop offset="1" stop-color="#4a4a47"/></radialGradient>
  <filter id="fEmb" x="-5%" y="-10%" width="110%" height="125%"><feDropShadow dx="0" dy="1.6" stdDeviation=".35" flood-color="#fff" flood-opacity=".9"/></filter>
</defs></svg>

<!-- MENU -->
<section id="s-menu" class="scr on">
  <div class="hd"><div class="ttl">Меню</div><div class="hr"><div class="bal balv"></div></div></div>
  <div class="scroll">
    <div class="tile big" data-go="gen"><div class="art" id="a-gen"></div><div class="tl">Генератор</div></div>
    <div class="tile wide bonus" id="t-bonus"><div class="art" id="a-bonus"></div><div class="tl">Ежедневный бонус</div></div>
    <div class="tile wide upg" data-go="up"><div class="art"><span>⬆️</span><div><b>Улучшения</b><small>Больше места в инвентаре и сейфе</small></div></div><div class="tl">Улучшения</div></div>
    <div class="grid">
      <div class="tile" data-go="col"><div class="art" id="a-col"></div><div class="tl">Коллекция</div></div>
      <div class="tile" data-go="safe"><div class="art" id="a-safe"></div><div class="tl">Сейф</div></div>
      <div class="tile" data-go="cat"><div class="art" id="a-cat"></div><div class="tl">Каталог редкостей</div></div>
      <div class="tile" data-go="stats"><div class="art" id="a-stats"></div><div class="tl">Статистика</div></div>
    </div>
  </div>
</section>

<!-- GENERATOR -->
<section id="s-gen" class="scr">
  <div id="flash"></div><div id="fx"></div>
  <div class="hd nt"><button class="back" data-back></button><div class="ttl">Генератор</div><div class="hr"><div class="bal balv"></div></div></div>
  <div class="stagebox">
    <div id="pill"></div>
    <div id="stage"></div>
    <div id="info"></div>
  </div>
  <div class="acts nt" id="acts" style="visibility:hidden">
    <button class="btn g" id="safeLast">В сейф</button>
    <button class="btn" id="sellLast"></button>
  </div>
  <button class="cchip nt" id="cchip"></button>
  <div class="foot" id="foot"></div>
</section>

<!-- COUNTRY -->
<section id="s-country" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Страна</div></div>
  <div class="scroll" id="clist"></div>
</section>

<!-- COLLECTION -->
<section id="s-col" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Коллекция</div>
    <div class="hr"><div class="bal balv"></div><div class="sub" id="col-n"></div></div></div>
  <div style="padding:0 16px 10px;text-align:right" class="sub" id="col-v"></div>
  <div class="chips" id="col-chips"></div>
  <div class="list" id="col-list"></div>
  <div class="bar" id="col-bar"></div>
</section>

<!-- SAFE -->
<section id="s-safe" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Сейф</div>
    <div class="hr"><div class="bal balv"></div><div class="sub" id="safe-n"></div></div></div>
  <div style="padding:0 16px 10px;text-align:right" class="sub" id="safe-v"></div>
  <div class="chips" id="safe-chips"></div>
  <div class="list" id="safe-list"></div>
  <div class="bar" id="safe-bar"></div>
</section>

<!-- UPGRADES -->
<section id="s-up" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Улучшения</div><div class="hr"><div class="bal balv"></div></div></div>
  <div class="scroll" id="uplist"></div>
</section>

<!-- CATALOG -->
<section id="s-cat" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Каталог редкостей</div></div>
  <div class="scroll" id="catlist"></div>
</section>

<!-- STATS -->
<section id="s-stats" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Статистика</div></div>
  <div class="scroll" id="statlist"></div>
</section>

<div class="sheet" id="sheet"><div class="sbox">
  <div class="sh">Фильтры</div>
  <div class="sl">Страна</div><div class="chips" id="fc"></div>
  <div class="sl">Редкость</div><div class="chips" id="fr"></div>
  <button class="btn" id="sdone">Готово</button>
</div></div>
<div class="sheet dlg" id="dlg"><div class="sbox"><div class="sh">Подтверди продажу</div><div id="dlg-t" style="color:#c9cddb;line-height:1.45"></div>
  <div style="display:flex;gap:10px;margin-top:18px"><button class="btn g" id="dlg-no" style="flex:1;margin:0">Отмена</button><button class="btn" id="dlg-yes" style="flex:1;margin:0">Продать</button></div></div></div>
<div id="toast"></div>

<script>
//#LOGIC
const COST=3000,CUR='₽';
// улучшения: вместимость инвентаря и сейфа по уровням и цена перехода на следующий уровень
const INV_CAPS=[100,250,500,1000,2500,5000,6000,7000,8000,9000,10000];
const INV_COST=[1200000,3000000,7500000,18000000,48000000,120000000,180000000,240000000,300000000,360000000];
const SAFE_CAPS=[20,25,30,35,40,50,60,70,80,90,100];
const SAFE_COST=[6000000,14000000,36000000,84000000,180000000,360000000,600000000,960000000,1440000000,2400000000];
const RK=['common','uncommon','rare','epic','legendary'];
// w — шанс выпадения (%), lo/hi — диапазон цены; редкость определяется баллами ценности номера
const R={
  common:   {n:'Обычный',    c:'#9ea3b5',w:85,  lo:300,hi:4500},
  uncommon: {n:'Необычный',  c:'#3ddc84',w:11,  lo:4000,hi:36000},
  rare:     {n:'Редкий',     c:'#3b9bff',w:3.2, lo:36000,hi:320000},
  epic:     {n:'Эпический',  c:'#b46bff',w:0.7, lo:300000,hi:2200000},

function evalPlate(p){
  const d=p.d,l=p.l,n=d.length,A=[...d],tags=[];
  let dp=0,lp=0;
  const zero=/^0+$/.test(d),same=!zero&&A.every(x=>x===A[0]);
  const asc=A.every((x,i)=>i===0||+x===+A[i-1]+1),desc=A.every((x,i)=>i===0||+x===+A[i-1]-1);
  const pal=d===A.slice().reverse().join('');
  if(same){dp=n===3?26:30;tags.push('Все цифры одинаковые')}
  else if(/^0+[1-9]$/.test(d)){dp=/^0+7$/.test(d)?20:16;tags.push('Малый номер');if(/^0+7$/.test(d))tags.push('Номер агента 007')}
  else if(/^[1-9]0+$/.test(d)){dp=n===3?10:12;tags.push('Круглый номер')}
  else if(!zero){
    if(n===3&&/^[1-9][1-9]0$/.test(d)){dp+=3;tags.push('Круглый десяток')}
    if(n===4&&/^[1-9][1-9]00$/.test(d)){dp+=7;tags.push('Круглая сотня')}
    if(asc||desc){dp+=9;tags.push('Последовательность цифр')}
    else if(pal){dp+=6;tags.push('Зеркальный номер')}
    else if(n===4&&(/^(\d)\1(\d)\2$/.test(d)||/^(\d)(\d)\1\2$/.test(d))){dp+=5;tags.push('Две пары цифр')}
    else if(n===4&&A.some(x=>A.filter(y=>y===x).length===3)){dp+=8;tags.push('3 одинаковые цифры')}
    else if(/(\d)\1/.test(d)&&!/^[1-9][1-9]00$/.test(d)&&!/^[1-9][1-9]0$/.test(d)){dp+=2;tags.push('2 одинаковые цифры')}
  }
  if([...l].every(x=>x===l[0])){lp=l.length>=3?9:4;tags.push(l.length+' одинаковые буквы')}
  else if(/(.)\1/.test(l)){lp=2;tags.push('2 одинаковые буквы')}
  const g=regInfo(p),rp=g.pts;
  if(rp>=7)tags.push('Престижный регион');
  const sn=seriesNote(p);if(sn){tags.push('Служебная серия')}
  let syn=0;
  if(dp>=16&&(lp>=4||rp>=7)){syn=8;tags.push('Редкое сочетание')}
  return{pts:dp+lp+rp+syn+(sn?6:0),tags,dp,lp,rp};
}

function genD(n,m){
  const a=()=>1+rnd(9),rd=()=>{let s;do s=Array.from({length:n},()=>rnd(10)).join('');while(/^0+$/.test(s));return s};
  switch(m){
    case'same':return String(a()).repeat(n);
    case'small':return '0'.repeat(n-1)+a();
    case'round':return a()+'0'.repeat(n-1);
    case'round2':return n===3?''+a()+a()+'0':''+a()+a()+'00';
    case'seq':{const asc=Math.random()<.5,s=asc?rnd(11-n):n-1+rnd(11-n);return Array.from({length:n},(_,i)=>asc?s+i:s-i).join('')}
    case'pal':{let x,y;do{x=rnd(10);y=rnd(10)}while(x===y||x===0&&false);return n===3?`${x}${y}${x}`:`${x}${y}${y}${x}`}
    case'pairs':{let x,y;do{x=rnd(10);y=rnd(10)}while(x===y);return n===4?(Math.random()<.5?`${x}${x}${y}${y}`:`${x}${y}${x}${y}`):`${x}${x}${y}`}
    case'triple':{let x,y;do{x=rnd(10);y=rnd(10)}while(x===y);if(n===4){const s=[x,x,x,y];s.sort(()=>Math.random()-.5);return s.join('')}return String(x).repeat(3)}
    case'pair':{let s;do s=rd();while(!/(\d)\1/.test(s));return s}
    default:return rd();
  }
}
function genL(C,n,m){
  const L=[...C.L];
  if(m==='same')return pick(L).repeat(n);
  if(m==='pair'&&n===3){const x=pick(L),y=pick(L);return Math.random()<.5?x+x+y:y+x+x}
  let s;do s=Array.from({length:n},()=>pick(L)).join('');while(n>1&&[...s].every(x=>x===s[0])||/(.)\1/.test(s)&&m!=='pair'&&false);
  return s;
}

function build(tp,r){

function priceOf(p){
  const e=evalPlate(p),i=ridx(p.r),Rr=R[p.r],a=PT[i],b=i<4?PT[i+1]:PT[4]+24;

  return Math.max(10,v>100000?Math.round(v/1000)*1000:Math.round(v/10)*10);
}

function countryLabel(){return S.sel==='any'?'Любая страна':CC[S.sel].name}
let animTok=0,lockUntil=0;
function tierFx(k){const e=document.createElement('div');e.className='tierlbl';e.style.setProperty('--c',R[RK[k]].c);e.textContent=R[RK[k]].n+'!';$('fx').appendChild(e);setTimeout(()=>e.remove(),1000)}
function sparks(r){const n=r==='legendary'?36:22;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='spk';const a=Math.random()*6.283,d=90+Math.random()*190;e.style.setProperty('--c',R[r].c);e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');$('fx').appendChild(e);setTimeout(()=>e.remove(),1200)}}
function pillHTML(r,v){return `<div class="pill rr${ridx(r)}"><span class="pn">${R[r].n}</span>${dashes(r)}<span class="pp">${money(v)}</span></div>`}
function infoHTML(p){return infoLines(p).map((t,i,a)=>`<div class="${i===0&&seriesNote(p)?'isn':i===a.length-1&&!seriesNote(p)?'ifact':''}">${t}</div>`).join('')}
function clearGen(){animTok++;$('stage').innerHTML='';$('pill').innerHTML='';$('info').innerHTML='';$('acts').style.visibility='hidden'}
function renderGen(){
  $('cchip').innerHTML=`<span class="${flagCls(S.sel)}"></span><span>${countryLabel()}</span><span style="color:var(--mut)">▾</span>`;
  $('foot').textContent=`Тап по экрану — ${money(COST)}`;
  const p=S.plates.find(x=>x.id===S.last);
  if(!p){clearGen();$('stage').innerHTML=`<div class="ghost">Нажми на экран,<br>чтобы получить номер</div>`;return}
  if(!$('stage').querySelector('.pl'))showResult(p,false);
}
function showResult(p,anim=true){
  const tok=++animTok,st=$('stage'),hi=ridx(p.r)>=3,fin=()=>{
    if(tok!==animTok)return;
    $('pill').innerHTML=pillHTML(p.r,p.v);$('info').style.opacity=1;$('info').innerHTML=infoHTML(p);
    const pl=st.querySelector('.pl');if(pl)pl.classList.add('pg-'+p.r);
    $('sellLast').textContent='Продать за '+money(p.v);$('sellLast').disabled=false;
  };
  st.innerHTML=plateEl(p,!(anim&&hi));
  if(anim&&!hi)st.firstChild.classList.add('pop');
  $('acts').style.visibility='visible';
  if(!(anim&&hi)){
    $('pill').innerHTML=pillHTML(p.r,p.v);$('info').style.opacity=1;$('info').innerHTML=infoHTML(p);
    $('sellLast').textContent='Продать за '+money(p.v);$('sellLast').disabled=false;return;
  }
  // эпик / легендарка: цена растёт, редкость поднимается ступенями
  const fl=$('flash'),top=ridx(p.r),T=1300+top*450,lo=R.common.lo,t0=performance.now(),pl0=st.firstChild;
  lockUntil=Date.now()+T+350;pl0.classList.add('hide');
  $('info').style.opacity=0;$('sellLast').disabled=true;$('sellLast').textContent='…';
  let cur=-1;
  const pn=()=>$('pill').querySelector('.pill');
  (function step(now){
    if(tok!==animTok)return;
    const u=Math.min(1,(now-t0)/T),e=1-Math.pow(1-u,2.2);
    const v=u>=1?p.v:Math.max(lo,Math.round(lo*Math.pow(p.v/lo,e)));
    let k=0;for(let i=0;i<=top;i++)if(v>=R[RK[i]].lo)k=i;if(u>=1)k=top;
    if(k!==cur){
      cur=k;$('pill').innerHTML=pillHTML(RK[k],v);const el=pn();el.classList.add('bump');
      if(k>=2)tierFx(k);
      if(k>=1){fl.style.setProperty('--fc',R[RK[k]].c);fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');hap(k>=top?'success':'l')}
    }else{pn().querySelector('.pp').textContent=money(v)}
    if(u<1)requestAnimationFrame(step);else{pl0.classList.remove('hide');pl0.classList.add('reveal');sparks(p.r);if(top>=4){st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake')}fin()}
  })(t0);
}
function gen(){
  if(Date.now()<lockUntil)return;
  if(S.plates.filter(p=>!p.safe).length>=invCap()){toast('Инвентарь заполнен — продай номера или улучши инвентарь');hap('error');return}
  if(S.coins<COST){toast('Не хватает на генерацию. Продай номера или забери бонус');hap('error');return}
  S.coins-=COST;S.st.spent+=COST;S.st.gen++;
  const cc=S.sel==='any'?pick(['kz','ru','by']):S.sel,tp=pickType(cc);
  const p=build(tp,rollR());p.v=priceOf(p);p.id=Date.now().toString(36)+rnd(1e6).toString(36);p.t=Date.now();
  S.plates.unshift(p);S.last=p.id;S.types[tp]=1;
  if(!S.st.best||p.v>S.st.best.v)S.st.best=p;
  saveSoon();renderTop();showResult(p);
  hap(ridx(p.r)>=4?'success':ridx(p.r)>=3?'h':'l');
}
$('s-gen').addEventListener('pointerdown',e=>{
  if(e.target.closest('.nt'))return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  gen();
});
$('cchip').onclick=()=>go('country');

  save();renderTop();renderGen();hap('l');toast('Продано: '+money(p.v));
};
$('safeLast').onclick=()=>{
  const p=S.plates.find(x=>x.id===S.last);if(!p)return;
  if(S.plates.filter(x=>x.safe).length>=safeCap()){toast('Сейф заполнен — улучши его в разделе «Улучшения»');return}
  p.safe=1;S.last=null;save();renderGen();hap('l');toast('Номер в сейфе');
};

/* ---------- Collection / Safe ---------- */
const UI={
  col:{sort:'price',dir:-1,fc:'all',fr:'all',lim:60,sel:new Set()},
  safe:{sort:'price',dir:-1,fc:'all',fr:'all',lim:60,sel:new Set()}
};
const inMode=(p,m)=>m==='safe'?!!p.safe:!p.safe;
function listFor(m){
  const u=UI[m];
  const a=S.plates.filter(p=>inMode(p,m)&&(u.fc==='all'||p.cc===u.fc)&&(u.fr==='all'||p.r===u.fr));
  return a.sort((x,y)=>{
    const v=u.sort==='price'?x.v-y.v:u.sort==='date'?x.t-y.t:(ridx(x.r)-ridx(y.r))||(x.v-y.v);

function rowHTML(p,sel){

}
function chipsHTML(m){
  const u=UI[m],ar=u.dir<0?'▼':'▲';
  const f=u.fc!=='all'||u.fr!=='all';
  return `<button class="chip${f?' on':''}" data-f="1">Фильтры</button>`+
    [['date','Дата'],['price','Цена'],['rar','Редкость']].map(([k,n])=>`<button class="chip${u.sort===k?' on':''}" data-s="${k}">${n}${u.sort===k?' '+ar:''}</button>`).join('');
}
function renderList(m){
  const u=UI[m],all=S.plates.filter(p=>inMode(p,m)),list=listFor(m);
  u.sel=new Set([...u.sel].filter(id=>list.some(p=>p.id===id)));
  $(m+'-n').textContent=`${all.length} / ${m==='safe'?safeCap():invCap()}`;
  $(m+'-v').textContent='Стоимость '+(m==='safe'?'сейфа':'коллекции')+'  '+money(all.reduce((s,p)=>s+p.v,0));

  const vis=list.slice(0,u.lim);
  $(m+'-list').innerHTML=vis.length?vis.map(p=>rowHTML(p,u.sel.has(p.id))).join('')+(list.length>vis.length?`<button class="btn g more" data-more="1">Показать ещё (${list.length-vis.length})</button>`:''):
    `<div class="empty">${m==='safe'?'Сейф пуст.<br>Отправь сюда лучшие номера — они защищены от быстрой продажи':'Здесь пока пусто.<br>Нажми на экран в генераторе 👆'}</div>`;
  renderBar(m);

function renderBar(m){
  const u=UI[m],list=listFor(m),sel=list.filter(p=>u.sel.has(p.id)),sum=sel.reduce((s,p)=>s+p.v,0);

      ?`<button class="btn" data-safe="1"${sel.length?'':' disabled'}>Поместить в сейф</button><button class="btn pr" data-sell="1"${sel.length?'':' disabled'}>Быстрая продажа${sel.length?`<small>${money(sum)}</small>`:''}</button>`
      :`<button class="btn pr" data-unsafe="1"${sel.length?'':' disabled'}>Убрать из сейфа</button>`);
}
['col','safe'].forEach(m=>{
  $(m+'-list').addEventListener('click',e=>{
    if(e.target.closest('[data-more]')){UI[m].lim+=60;renderList(m);return}
    const r=e.target.closest('.row');if(!r)return;
    const u=UI[m],id=r.dataset.id;
    u.sel.has(id)?u.sel.delete(id):u.sel.add(id);
    r.classList.toggle('sel');renderBar(m);hap('l');

    const u=UI[m];
    if(e.target.closest('[data-f]')){openSheet(m);return}
    const s=e.target.closest('[data-s]');if(!s)return;
    if(u.sort===s.dataset.s)u.dir*=-1;else{u.sort=s.dataset.s;u.dir=-1}
    renderList(m);
  });
  $(m+'-bar').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    const u=UI[m],list=listFor(m),sel=list.filter(p=>u.sel.has(p.id));
    if(b.dataset.all){
      if(sel.length===list.length)u.sel.clear();else u.sel=new Set(list.map(p=>p.id));
      renderList(m);
    }else if(b.dataset.safe){
      const free=safeCap()-S.plates.filter(p=>p.safe).length;

    }else if(b.dataset.sell){

        S.coins+=sum;S.st.earned+=sum;u.sel.clear();save();renderTop();renderList(m);toast(`Продано ${sel.length} шт. за ${money(sum)}`);hap('success');
      };
      if(sel.some(p=>ridx(p.r)>=3))ask(`Продать ${sel.length} шт. за ${money(sum)}? Среди них есть эпические или легендарные.`,doSell);else doSell();

});

    <div class="pips">${caps.map((c,i)=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div>
    <div class="un">Уровень <b>${lv+1} / ${caps.length}</b><br>`+
    (max?`Достигнут максимум — <b>${fmt(cur)}</b> ячеек.</div><div class="mx">Максимальный уровень</div></div>`
        :`Следующий: <b>${fmt(nx)}</b> ячеек (+${fmt(nx-cur)})</div><button class="btn${S.coins<cost?' dis':''}" data-up="${key}">Улучшить за ${moneyS(cost)}</button></div>`);
}
function renderUp(){
  $('uplist').innerHTML=
    upCard('inv','','🗄️','Инвентарь',INV_CAPS,INV_COST,S.plates.filter(p=>!p.safe).length)+
    upCard('safe','sf','🔐','Сейф',SAFE_CAPS,SAFE_COST,S.plates.filter(p=>p.safe).length);
}
$('uplist').addEventListener('click',e=>{
  const b=e.target.closest('[data-up]');if(!b)return;
  const k=b.dataset.up,caps=k==='inv'?INV_CAPS:SAFE_CAPS,costs=k==='inv'?INV_COST:SAFE_COST,lv=S.up[k];
  if(lv>=caps.length-1)return;
  const cost=costs[lv];
  if(S.coins<cost){toast('Не хватает '+moneyS(cost-S.coins));hap('error');return}
  S.coins-=cost;S.up[k]=lv+1;save();renderTop();renderUp();hap('success');
  toast((k==='inv'?'Инвентарь':'Сейф')+' расширен до '+fmt(caps[lv+1])+' ячеек');
});

/* ---------- Catalog ---------- */
const DESC={
  common:'Ничем не примечательное сочетание цифр, букв и региона.',
  uncommon:'Парные цифры или буквы, круглые числа, популярные регионы.',
  rare:'Зеркальные цифры, последовательности, малые номера, одинаковые буквы, престижные регионы.',
  epic:'Все цифры одинаковые, малые номера (001–009) или сильные комбинации с регионом Москвы, Астаны, Алматы, Минска.',
  legendary:'Максимальная ценность: красивые цифры вместе с одинаковыми буквами, служебной серией и престижным регионом.'
};
function renderCatalog(){
  $('catlist').innerHTML=RK.map((k,i)=>{
    const r=R[k],samples=['ru_civ','kz_civ','by_civ'].map(tp=>plateEl(build(tp,k),false)).join('');
    return `<div class="cat rr${i}"><div class="ch"><b>${r.n}</b><span>шанс ${String(r.w).replace('.',',')}%</span></div>
      <div class="cd">${money(r.lo)} — ${money(r.hi)}</div><div class="cr">${DESC[k]}</div><div class="cs">${samples}</div></div>`;
  }).join('')+`<div class="empty" style="margin-top:8px">Цена зависит от ценности номера: цифры, буквы, регион и служебная серия. Подробности видны под каждым выпавшим номером.</div>`;
}

/* ---------- Stats ---------- */
function renderStats(){
  const all=S.plates,cnt=k=>all.filter(p=>p.r===k).length,b=S.st.best;
  const val=all.reduce((s,p)=>s+p.v,0);
  const row=(a,v)=>`<div class="st"><span>${a}</span><b>${v}</b></div>`;
  $('statlist').innerHTML=
    (b?`<div class="stb rr${ridx(b.r)}"><div class="sub">Самый дорогой номер</div>${plateEl(b,true)}<div style="margin-top:10px;font-size:20px;font-weight:700;text-align:center">${money(b.v)}</div></div>`:'')+
    row('Сгенерировано',fmt(S.st.gen))+row('Потрачено',money(S.st.spent))+row('Заработано на продаже',money(S.st.earned))+
    row('Номеров в наличии',fmt(all.length))+row('Стоимость всех номеров',money(val))+
    RK.map(k=>`<div class="st"><span style="color:${R[k].c}">${R[k].n}</span><b>${cnt(k)}</b></div>`).join('')+
    row('Открыто типов номеров',`${Object.keys(S.types).length} / ${TOTAL_TYPES}`);
}

/* ---------- Events ---------- */
$('dlg-yes').onclick=()=>closeAsk(true);
$('dlg-no').onclick=()=>closeAsk(false);
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeAsk(false)});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.closest('[data-back]')){back();return}
  if(e.target.closest('#t-bonus')){
    if(bonusLeft()>0){toast('Бонус будет доступен позже');return}
    S.bonusAt=Date.now();S.coins+=BONUS;save();renderTop();renderMenu();hap('success');toast('+'+money(BONUS));
  }
});
setInterval(()=>{if($('s-menu').classList.contains('on'))renderMenu()},30000);

initArt();renderTop();renderMenu();
try{tg.BackButton.hide()}catch(e){}
</script>
</body>
</html>

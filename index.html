<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f14">
<title>Plate Hunter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f14;--p:#171a24;--p2:#1f2330;--txt:#f1f3f8;--mut:#8a90a2;--blue:#0b5fd0;
  --top:max(env(safe-area-inset-top),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
.scr{position:absolute;inset:0;padding-top:calc(var(--top) + 10px);display:none;flex-direction:column}
.scr.on{display:flex}
.hd{display:flex;align-items:center;gap:10px;padding:6px 16px 12px;flex:none}
.back{width:40px;height:40px;border:0;background:none;color:#8d93a4;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.ttl{font-size:24px;font-weight:700;color:#a9aebd;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{text-align:right;line-height:1.3;flex:none}
.bal{font-size:17px;font-weight:700;color:#aeb3c2;white-space:nowrap}
.sub{font-size:13px;color:var(--mut);white-space:nowrap}
.scroll{flex:1;overflow-y:auto;padding:0 16px 28px;-webkit-overflow-scrolling:touch}

/* ---------- plates ---------- */
.pl{width:100%}
.plsvg{width:100%;height:auto;display:block;overflow:visible}
.pg-uncommon{filter:drop-shadow(0 0 7px rgba(61,220,132,.55))}
.pg-rare{filter:drop-shadow(0 0 10px rgba(59,155,255,.7))}
.pg-epic{filter:drop-shadow(0 0 14px rgba(180,107,255,.85))}
.pg-legendary{filter:drop-shadow(0 0 18px rgba(255,194,58,.95));animation:lg 1.5s ease-in-out infinite}
@keyframes lg{50%{filter:drop-shadow(0 0 32px rgba(255,194,58,1))}}
.pop{animation:pop .16s ease-out}
.pg-legendary.pop{animation:pop .16s ease-out,lg 1.5s .16s ease-in-out infinite}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:scale(1);opacity:1}}

/* ---------- menu ---------- */
.tile{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(165deg,#1d4fae 0%,#10306f 55%,#0a1c47 100%);border:1px solid #29488f;height:116px}
.tile:active{transform:scale(.985)}
.tile.big{height:172px;margin-bottom:12px}
.tile.wide{height:88px;margin-bottom:12px}
.tile .tl{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;background:rgba(4,9,24,.82);font-weight:700;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase}
.art{position:absolute;inset:0 0 28px 0;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mp{position:absolute;width:62%}
.bonus{background:linear-gradient(120deg,#7b3fe4,#d9438f 60%,#ff8a3d);border-color:#b25ad0}
.bonus.cd{background:linear-gradient(120deg,#23283a,#1a1e2c);border-color:#2c3248}
.bonus .art{justify-content:flex-start;padding:0 18px;gap:14px;font-size:36px}
.bonus b{font-size:22px;display:block}
.bonus small{font-size:13px;opacity:.85;display:block}

/* ---------- generator ---------- */
.cchip{align-self:center;display:flex;align-items:center;gap:10px;background:var(--p2);border:1px solid #2b3042;border-radius:999px;padding:8px 14px 8px 8px;font-weight:600;font-size:15px}
.cchip .fl{width:30px;height:30px;border-radius:50%;mask-image:none;-webkit-mask-image:none}
.stagebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;gap:18px;min-height:0}
#stage{width:min(94vw,460px)}
.ghost{width:100%;aspect-ratio:520/112;border:2px dashed #3a4057;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#6b7290;font-weight:600;font-size:16px;text-align:center;line-height:1.35}
#meta{text-align:center;min-height:108px}
.rl{font-size:26px;font-weight:800}
.sub2{font-size:14px;color:var(--mut);margin-top:2px}
.dash{display:flex;gap:5px;justify-content:center;margin:9px 0}
.dash i{width:26px;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}
.pv{font-size:24px;font-weight:700}
.acts{display:flex;gap:10px;padding:0 16px;justify-content:center;min-height:50px;flex:none}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:15px;font-weight:700;background:var(--blue);color:#fff}
.btn.g{background:var(--p2);color:#d5d9e6}
.btn:disabled{opacity:.35}
.foot{padding:14px 16px calc(18px + env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:13px;flex:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 42%,var(--fc,#fff) 0%,transparent 62%)}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}

/* ---------- country ---------- */
.crow{position:relative;height:74px;border-radius:20px;background:#1a1c26;margin-bottom:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#8b90a0}
.crow .fl{position:absolute;left:0;top:0;bottom:0;width:42%}
.crow .cn{position:relative}
.crow .cc{position:absolute;right:20px;font-size:17px;font-weight:700}
.crow.on{background:var(--blue);color:#fff}
.fl{-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.f-ru{background:linear-gradient(#eceff3 33.3%,#0039a6 33.3% 66.6%,#d52b1e 66.6%)}
.f-by{background:repeating-linear-gradient(0deg,#c8313e 0 5px,#fff 5px 8px) 0 0/11% 100% no-repeat,linear-gradient(#c8313e 66.6%,#2e8f3f 66.6%)}
.f-kz{background:radial-gradient(circle at 58% 42%,#ffd24a 0 15%,transparent 16%),#00afca}
.f-any{background:linear-gradient(90deg,#00afca 33.3%,#eceff3 33.3% 66.6%,#d52b1e 66.6%)}
.cchip .f-any,.cchip .f-ru,.cchip .f-by,.cchip .f-kz{-webkit-mask-image:none;mask-image:none}

/* ---------- list screens ---------- */
.chips{display:flex;gap:8px;padding:0 16px 12px;flex:none;overflow-x:auto}
.chip{border:0;background:var(--p2);color:#c9cddb;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--blue);color:#fff}
.list{flex:1;overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.row{position:relative;display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 14px 10px 12px;margin-bottom:10px;background:linear-gradient(135deg,var(--rb),rgba(20,22,30,.95) 78%);border:2px solid transparent}
.row.sel{border-color:#3b8bff;box-shadow:0 0 0 1px #3b8bff55}
.row.sel::after{content:"✓";position:absolute;left:8px;top:6px;width:22px;height:22px;border-radius:50%;background:#3b8bff;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;z-index:2}
.row .pl{width:52%;flex:none}
.row .ri{flex:1;text-align:right;min-width:0}
.row .rt{font-size:12px;color:#9aa0b3;line-height:1.3}
.row .dash{justify-content:flex-end;margin:6px 0 4px}
.row .dash i{width:20px;height:4px}
.row .rv{font-size:18px;font-weight:700;color:#cfd3e0;white-space:nowrap}
.rr0{--rc:#9ea3b5;--rb:rgba(158,163,181,.20)}
.rr1{--rc:#3ddc84;--rb:rgba(61,220,132,.22)}
.rr2{--rc:#3b9bff;--rb:rgba(59,155,255,.26)}
.rr3{--rc:#b46bff;--rb:rgba(180,107,255,.28)}
.rr4{--rc:#ffc23a;--rb:rgba(255,194,58,.30)}
.more{display:block;margin:4px auto 10px}
.empty{color:var(--mut);text-align:center;margin-top:60px;font-size:15px;line-height:1.5}
.bar{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));flex:none}
.bar .btn{flex:1;padding:14px 8px;font-size:15px;background:var(--p2);color:#e5e8f2;line-height:1.2}
.bar .btn small{display:block;font-weight:600;font-size:12px;opacity:.75}
.bar .btn:disabled{color:#5a6075;opacity:1}
.bar .btn.pr:not(:disabled){background:var(--blue);color:#fff}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sbox{width:100%;background:#151822;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sh{font-size:20px;font-weight:700;margin-bottom:14px}
.sl{color:var(--mut);font-size:13px;margin:12px 0 8px}
.sbox .chips{padding:0;flex-wrap:wrap;overflow:visible}
.sbox .chip{padding:10px 14px;font-size:14px}
.sbox .btn{width:100%;margin-top:18px}
.dlg{z-index:40}

/* ---------- upgrades ---------- */
.tile.upg .art{justify-content:flex-start;padding:0 18px;gap:14px;font-size:34px}
.tile.upg b{font-size:20px;display:block}
.tile.upg small{font-size:13px;opacity:.8;display:block}
.upc{border-radius:20px;padding:16px;margin-bottom:14px;background:linear-gradient(150deg,#1b2a52,#141824 70%);border:1px solid #2a3a6b}
.upc.sf{background:linear-gradient(150deg,#4a3a14,#17151a 70%);border-color:#6b5420}
.uh{display:flex;gap:12px;align-items:center}
.uh .ui{font-size:32px}
.uh b{font-size:20px;display:block}
.pips{display:flex;gap:4px;margin:14px 0 12px}
.pips i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
.pips i.on{background:#3b8bff}
.upc.sf .pips i.on{background:#ffc23a}
.un{font-size:14px;color:#b4bacc;margin-bottom:14px;line-height:1.45}
.un b{color:#fff}
.upc .btn{width:100%}
.upc .btn.dis{background:var(--p2);color:#8a90a2}
.upc .mx{text-align:center;color:#ffc23a;font-weight:700;padding:6px 0}

/* ---------- catalog / stats ---------- */
.cat{border-radius:20px;padding:14px;margin-bottom:12px;background:linear-gradient(135deg,var(--rb),rgba(20,22,30,.95) 80%);border:1px solid rgba(255,255,255,.06)}
.cat .ch{display:flex;justify-content:space-between;align-items:baseline}
.cat .ch b{font-size:20px;color:var(--rc)}
.cat .ch span{color:var(--mut);font-size:13px}
.cat .cd{margin-top:6px;font-size:15px;font-weight:600}
.cat .cr{margin:4px 0 12px;font-size:13px;color:#9aa0b3;line-height:1.4}
.cs{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 10px}
.cs .pl{width:230px;flex:none}
.st{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #20243133;font-size:16px}
.st span{color:var(--mut)}
.st b{font-weight:700}
.stb{border-radius:20px;padding:14px;margin:6px 0 16px;background:linear-gradient(135deg,var(--rb),rgba(20,22,30,.95) 80%)}
.stb .sub{margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a2f40;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gWht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfa"/><stop offset=".5" stop-color="#ebebe6"/><stop offset="1" stop-color="#c9c9c3"/></linearGradient>
  <linearGradient id="gYel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd84a"/><stop offset=".55" stop-color="#f4b905"/><stop offset="1" stop-color="#cf9600"/></linearGradient>
  <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gStrip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a63c4"/><stop offset="1" stop-color="#143a82"/></linearGradient>
  <radialGradient id="gRivet" cx=".35" cy=".35"><stop offset="0" stop-color="#b9b9b4"/><stop offset="1" stop-color="#4a4a47"/></radialGradient>
  <filter id="fEmb" x="-5%" y="-10%" width="110%" height="125%"><feDropShadow dx="0" dy="1.6" stdDeviation=".35" flood-color="#fff" flood-opacity=".9"/></filter>
</defs></svg>

<!-- MENU -->
<section id="s-menu" class="scr on">
  <div class="hd"><div class="ttl">Меню</div><div class="hr"><div class="bal balv"></div></div></div>
  <div class="scroll">
    <div class="tile big" data-go="gen"><div class="art" id="a-gen"></div><div class="tl">Генератор</div></div>
    <div class="tile wide bonus" id="t-bonus"><div class="art" id="a-bonus"></div><div class="tl">Ежедневный бонус</div></div>
    <div class="tile wide upg" data-go="up"><div class="art"><span>⬆️</span><div><b>Улучшения</b><small>Больше места в инвентаре и сейфе</small></div></div><div class="tl">Улучшения</div></div>
    <div class="grid">
      <div class="tile" data-go="col"><div class="art" id="a-col"></div><div class="tl">Коллекция</div></div>
      <div class="tile" data-go="safe"><div class="art" id="a-safe"></div><div class="tl">Сейф</div></div>
      <div class="tile" data-go="cat"><div class="art" id="a-cat"></div><div class="tl">Каталог редкостей</div></div>
      <div class="tile" data-go="stats"><div class="art" id="a-stats"></div><div class="tl">Статистика</div></div>
    </div>
  </div>
</section>

<!-- GENERATOR -->
<section id="s-gen" class="scr">
  <div id="flash"></div>
  <div class="hd nt"><button class="back" data-back></button><div class="ttl">Генератор</div><div class="hr"><div class="bal balv"></div></div></div>
  <button class="cchip nt" id="cchip"></button>
  <div class="stagebox">
    <div id="stage"></div>
    <div id="meta"></div>
  </div>
  <div class="acts nt" id="acts" style="visibility:hidden">
    <button class="btn g" id="safeLast">В сейф</button>
    <button class="btn" id="sellLast"></button>
  </div>
  <div class="foot" id="foot"></div>
</section>

<!-- COUNTRY -->
<section id="s-country" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Страна</div></div>
  <div class="scroll" id="clist"></div>
</section>

<!-- COLLECTION -->
<section id="s-col" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Коллекция</div>
    <div class="hr"><div class="bal balv"></div><div class="sub" id="col-n"></div></div></div>
  <div style="padding:0 16px 10px;text-align:right" class="sub" id="col-v"></div>
  <div class="chips" id="col-chips"></div>
  <div class="list" id="col-list"></div>
  <div class="bar" id="col-bar"></div>
</section>

<!-- SAFE -->
<section id="s-safe" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Сейф</div>
    <div class="hr"><div class="bal balv"></div><div class="sub" id="safe-n"></div></div></div>
  <div style="padding:0 16px 10px;text-align:right" class="sub" id="safe-v"></div>
  <div class="chips" id="safe-chips"></div>
  <div class="list" id="safe-list"></div>
  <div class="bar" id="safe-bar"></div>
</section>

<!-- UPGRADES -->
<section id="s-up" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Улучшения</div><div class="hr"><div class="bal balv"></div></div></div>
  <div class="scroll" id="uplist"></div>
</section>

<!-- CATALOG -->
<section id="s-cat" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Каталог редкостей</div></div>
  <div class="scroll" id="catlist"></div>
</section>

<!-- STATS -->
<section id="s-stats" class="scr">
  <div class="hd"><button class="back" data-back></button><div class="ttl">Статистика</div></div>
  <div class="scroll" id="statlist"></div>
</section>

<div class="sheet" id="sheet"><div class="sbox">
  <div class="sh">Фильтры</div>
  <div class="sl">Страна</div><div class="chips" id="fc"></div>
  <div class="sl">Редкость</div><div class="chips" id="fr"></div>
  <button class="btn" id="sdone">Готово</button>
</div></div>
<div class="sheet dlg" id="dlg"><div class="sbox"><div class="sh">Подтверди продажу</div><div id="dlg-t" style="color:#c9cddb;line-height:1.45"></div>
  <div style="display:flex;gap:10px;margin-top:18px"><button class="btn g" id="dlg-no" style="flex:1;margin:0">Отмена</button><button class="btn" id="dlg-yes" style="flex:1;margin:0">Продать</button></div></div></div>
<div id="toast"></div>

<script>
//#LOGIC
const COST=3000,CUR='₽';
// улучшения: вместимость инвентаря и сейфа по уровням и цена перехода на следующий уровень
const INV_CAPS=[100,250,500,1000,2500,5000,6000,7000,8000,9000,10000];
const INV_COST=[1200000,3000000,7500000,18000000,48000000,120000000,180000000,240000000,300000000,360000000];
const SAFE_CAPS=[20,25,30,35,40,50,60,70,80,90,100];
const SAFE_COST=[6000000,14000000,36000000,84000000,180000000,360000000,600000000,960000000,1440000000,2400000000];
const RK=['common','uncommon','rare','epic','legendary'];
const R={
  common:   {n:'Обычный',    c:'#9ea3b5',w:62,  lo:300,hi:4500},
  uncommon: {n:'Необычный',  c:'#3ddc84',w:25,  lo:4000,hi:38000},
  rare:     {n:'Редкий',     c:'#3b9bff',w:9,   lo:38000,hi:380000},
  epic:     {n:'Эпический',  c:'#b46bff',w:3.5, lo:450000,hi:6000000},
  legendary:{n:'Легендарный',c:'#ffc23a',w:0.5, lo:7500000,hi:150000000}
};
const rnd=n=>Math.floor(Math.random()*n),pick=a=>a[rnd(a.length)];
const CC={
  kz:{name:'Казахстан',L:'ABCEHKMOPTXY',reg:Array.from({length:20},(_,i)=>String(i+1).padStart(2,'0')),prem:['01','02']},
  ru:{name:'Россия',L:'АВЕКМНОРСТУХ',reg:['77','99','177','197','777','199','799','97','78','98','178','198','50','90','150','190','750','790','16','116','02','102','23','93','123','61','161','63','163','52','152','54','154','66','96','74','174','59','159','86','72','36','24','38','42','31','47','53','64','69','18'],
      prem:['77','99','177','197','777','199','799','97','78','98','178','198','50','90','150','190','750','790']},
  by:{name:'Беларусь',L:'ABEIKMHOPCTX',reg:['1','2','3','4','5','6','7'],prem:['7']}
};
const TYPES={
  ru_civ: {cc:'ru',name:'Гражданский',dn:3,ln:3,mult:1},
  kz_civ: {cc:'kz',name:'Гражданский',dn:3,ln:3,mult:1},
  by_civ: {cc:'by',name:'Гражданский',dn:4,ln:2,mult:1}
};
const TOTAL_TYPES=Object.keys(TYPES).length;
const LEG={3:['777','888','999','001','007','555'],4:['7777','8888','9999','0001','0007','5555']};

function rollR(){let x=Math.random()*100;for(const k of RK){if(x<R[k].w)return k;x-=R[k].w}return'common'}
function pickType(cc){return cc+'_civ'}

function rate(d,l){
  const A=[...d],same=A.every(x=>x===A[0]),leg=LEG[d.length].includes(d),ls=[...l].every(x=>x===l[0]);
  const seq=A.every((x,i)=>i===0||+x===+A[i-1]+1)||A.every((x,i)=>i===0||+x===+A[i-1]-1);
  const pal=d===A.slice().reverse().join(''),round=/^[1-9]0+$/.test(d),pair=/(\d)\1/.test(d);
  if(leg&&ls)return'legendary';
  if(same||leg)return'epic';
  if(seq||pal||ls)return'rare';
  if(round||pair)return'uncommon';
  return'common';
}

function build(tp,r){
  const T=TYPES[tp],C=CC[T.cc],n=T.dn;let best;
  const rd=()=>Array.from({length:n},()=>rnd(10)).join('');
  const rl=same=>{
    if(same)return pick([...C.L]).repeat(T.ln);
    let s;do s=Array.from({length:T.ln},()=>pick([...C.L])).join('');while([...s].every(x=>x===s[0]));
    return s;
  };
  for(let t=0;t<300;t++){
    let d,l;
    if(r==='legendary'){d=pick(LEG[n]);l=rl(true)}
    else if(r==='epic'){d=Math.random()<.6?String(rnd(10)).repeat(n):pick(LEG[n]);l=rl(false)}
    else if(r==='rare'){
      const k=rnd(3);
      if(k===0){
        const s=rnd(11-n);
        d=Array.from({length:n},(_,i)=>s+i).join('');
        if(Math.random()<.5)d=[...d].reverse().join('');
        l=rl(false);
      }else if(k===1){
        let a,b;do{a=rnd(10);b=rnd(10)}while(a===b);
        d=n===3?`${a}${b}${a}`:`${a}${b}${b}${a}`;l=rl(false);
      }else{d=rd();l=rl(true)}
    }
    else if(r==='uncommon'){
      if(Math.random()<.5)d=(1+rnd(9))+'0'.repeat(n-1);
      else{do d=rd();while(!/(\d)\1/.test(d))}
      l=rl(false);
    }
    else{d=rd();l=rl(false)}
    best={d,l};
    if(rate(d,l)===r)break;
  }
  return{tp,cc:T.cc,d:best.d,l:best.l,reg:pick(C.reg),r:rate(best.d,best.l)};
}

// цена: логарифмический разброс внутри диапазона редкости, премиальные регионы и тип номера двигают её вверх/вниз
function priceOf(p){
  const Rr=R[p.r];let t=Math.random()*.8;
  if(CC[p.cc].prem.includes(p.reg))t+=.2;
  t=Math.min(1,t);
  const v=Rr.lo*Math.pow(Rr.hi/Rr.lo,t)*TYPES[p.tp].mult;
  return Math.max(10,Math.round(v/10)*10);
}

    const u=UI[m],list=listFor(m),sel=list.filter(p=>u.sel.has(p.id));
    if(b.dataset.all){
      if(sel.length===list.length)u.sel.clear();else u.sel=new Set(list.map(p=>p.id));
      renderList(m);
    }else if(b.dataset.safe){
      const free=safeCap()-S.plates.filter(p=>p.safe).length;
      if(sel.length>free){toast(free?`В сейфе свободно только ${free}`:'Сейф заполнен');return}
      sel.forEach(p=>{p.safe=1;if(S.last===p.id)S.last=null});u.sel.clear();save();renderList(m);toast('Перемещено в сейф: '+sel.length);hap('success');
    }else if(b.dataset.unsafe){
      sel.forEach(p=>{delete p.safe});u.sel.clear();save();renderList(m);toast('Убрано из сейфа: '+sel.length);hap('l');
    }else if(b.dataset.sell){
      const sum=sel.reduce((s,p)=>s+p.v,0),doSell=()=>{
        const ids=new Set(sel.map(p=>p.id));
        S.plates=S.plates.filter(p=>!ids.has(p.id));if(ids.has(S.last))S.last=null;
        S.coins+=sum;S.st.earned+=sum;u.sel.clear();save();renderTop();renderList(m);toast(`Продано ${sel.length} шт. за ${money(sum)}`);hap('success');
      };
      if(sel.some(p=>ridx(p.r)>=3))ask(`Продать ${sel.length} шт. за ${money(sum)}? Среди них есть эпические или легендарные.`,doSell);else doSell();
    }
  });
});

/* ---------- Filter sheet ---------- */
let sheetMode='col';
function openSheet(m){
  sheetMode=m;const u=UI[m];
  $('fc').innerHTML=[['all','Все'],['kz','Казахстан'],['ru','Россия'],['by','Беларусь']].map(([k,n])=>`<button class="chip${u.fc===k?' on':''}" data-fc="${k}">${n}</button>`).join('');
  $('fr').innerHTML=[['all','Все']].concat(RK.map(k=>[k,R[k].n])).map(([k,n])=>`<button class="chip${u.fr===k?' on':''}" data-fr="${k}">${n}</button>`).join('');
  $('sheet').classList.add('on');
}
$('sheet').addEventListener('click',e=>{
  const u=UI[sheetMode],c=e.target.closest('[data-fc]'),r=e.target.closest('[data-fr]');
  if(c){u.fc=c.dataset.fc;openSheet(sheetMode)}
  else if(r){u.fr=r.dataset.fr;openSheet(sheetMode)}
  else if(e.target.id==='sheet'||e.target.id==='sdone'){$('sheet').classList.remove('on');u.lim=60;renderList(sheetMode)}
});

/* ---------- Upgrades ---------- */
function upCard(key,cls,icon,title,caps,costs,used){
  const lv=S.up[key],cur=caps[lv],nx=caps[lv+1],cost=costs[lv],max=lv>=caps.length-1;
  return `<div class="upc ${cls}"><div class="uh"><span class="ui">${icon}</span><div><b>${title}</b><div class="sub">Занято ${fmt(used)} из ${fmt(cur)} ячеек</div></div></div>
    <div class="pips">${caps.map((c,i)=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div>
    <div class="un">Уровень <b>${lv+1} / ${caps.length}</b><br>`+
    (max?`Достигнут максимум — <b>${fmt(cur)}</b> ячеек.</div><div class="mx">Максимальный уровень</div></div>`
        :`Следующий: <b>${fmt(nx)}</b> ячеек (+${fmt(nx-cur)})</div><button class="btn${S.coins<cost?' dis':''}" data-up="${key}">Улучшить за ${moneyS(cost)}</button></div>`);
}
function renderUp(){
  $('uplist').innerHTML=
    upCard('inv','','🗄️','Инвентарь',INV_CAPS,INV_COST,S.plates.filter(p=>!p.safe).length)+
    upCard('safe','sf','🔐','Сейф',SAFE_CAPS,SAFE_COST,S.plates.filter(p=>p.safe).length);
}
$('uplist').addEventListener('click',e=>{
  const b=e.target.closest('[data-up]');if(!b)return;
  const k=b.dataset.up,caps=k==='inv'?INV_CAPS:SAFE_CAPS,costs=k==='inv'?INV_COST:SAFE_COST,lv=S.up[k];
  if(lv>=caps.length-1)return;
  const cost=costs[lv];
  if(S.coins<cost){toast('Не хватает '+moneyS(cost-S.coins));hap('error');return}
  S.coins-=cost;S.up[k]=lv+1;save();renderTop();renderUp();hap('success');
  toast((k==='inv'?'Инвентарь':'Сейф')+' расширен до '+fmt(caps[lv+1])+' ячеек');
});

/* ---------- Catalog ---------- */
const DESC={
  common:'Случайные цифры и буквы без закономерностей.',
  uncommon:'Круглые числа (500, 7000) или пара одинаковых цифр подряд (112).',
  rare:'Последовательности (123, 987), «зеркала» (121) или одинаковые буквы.',
  epic:'Все цифры одинаковые (555) или красивые 777, 007, 001.',
  legendary:'Красивые цифры вместе с одинаковыми буквами, например А777АА.'
};
function renderCatalog(){
  $('catlist').innerHTML=RK.map((k,i)=>{
    const r=R[k],samples=['ru_civ','kz_civ','by_civ'].map(tp=>plateEl(build(tp,k),false)).join('');
    return `<div class="cat rr${i}"><div class="ch"><b>${r.n}</b><span>шанс ${String(r.w).replace('.',',')}%</span></div>
      <div class="cd">${money(r.lo)} — ${money(r.hi)}</div><div class="cr">${DESC[k]}</div><div class="cs">${samples}</div></div>`;
  }).join('')+`<div class="empty" style="margin-top:8px">Цена зависит от региона: Москва, Астана, Алматы, Минск и другие престижные регионы стоят дороже.</div>`;
}

/* ---------- Stats ---------- */
function renderStats(){
  const all=S.plates,cnt=k=>all.filter(p=>p.r===k).length,b=S.st.best;
  const val=all.reduce((s,p)=>s+p.v,0);
  const row=(a,v)=>`<div class="st"><span>${a}</span><b>${v}</b></div>`;
  $('statlist').innerHTML=
    (b?`<div class="stb rr${ridx(b.r)}"><div class="sub">Самый дорогой номер</div>${plateEl(b,true)}<div style="margin-top:10px;font-size:20px;font-weight:700;text-align:center">${money(b.v)}</div></div>`:'')+
    row('Сгенерировано',fmt(S.st.gen))+row('Потрачено',money(S.st.spent))+row('Заработано на продаже',money(S.st.earned))+
    row('Номеров в наличии',fmt(all.length))+row('Стоимость всех номеров',money(val))+
    RK.map(k=>`<div class="st"><span style="color:${R[k].c}">${R[k].n}</span><b>${cnt(k)}</b></div>`).join('')+
    row('Открыто типов номеров',`${Object.keys(S.types).length} / ${TOTAL_TYPES}`);
}

/* ---------- Events ---------- */
$('dlg-yes').onclick=()=>closeAsk(true);
$('dlg-no').onclick=()=>closeAsk(false);
$('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeAsk(false)});
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.closest('[data-back]')){back();return}
  if(e.target.closest('#t-bonus')){
    if(bonusLeft()>0){toast('Бонус будет доступен позже');return}
    S.bonusAt=Date.now();S.coins+=BONUS;save();renderTop();renderMenu();hap('success');toast('+'+money(BONUS));
  }
});
setInterval(()=>{if($('s-menu').classList.contains('on'))renderMenu()},30000);

initArt();renderTop();renderMenu();
try{tg.BackButton.hide()}catch(e){}
</script>
